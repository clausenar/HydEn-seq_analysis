# Checks deliberately not applied to this single-account research pipeline.
# Each one is a cost or complexity trade-off, not an oversight.
framework:
  - terraform
skip-check:
  # Customer-managed KMS keys (~$1/month each plus key policies). Data is
  # encrypted at rest with AWS-managed keys everywhere instead.
  - CKV_AWS_145 # S3 encrypted with KMS
  - CKV_AWS_119 # DynamoDB encrypted with a CMK
  - CKV_AWS_158 # CloudWatch log group encrypted with KMS
  - CKV_AWS_173 # Lambda environment variables encrypted with a CMK (they hold no secrets)
  - CKV_AWS_26  # SNS encryption: EventBridge can only publish to a topic encrypted with a CMK
  # Doubles storage cost; raw input is already archived to processed_raw/ and
  # can be re-downloaded from the public archive.
  - CKV_AWS_144 # S3 cross-region replication
  - CKV_AWS_21  # S3 versioning on the data bucket (`aws s3 mv` would keep every copy)
  # Logging/tracing beyond CloudWatch Logs, which every component already writes.
  - CKV_AWS_18  # S3 access logging
  - CKV2_AWS_11 # VPC flow logs
  - CKV_AWS_50  # Lambda X-Ray tracing
  - CKV_AWS_338 # 1-year log retention (30 days is kept)
  # Lambda hardening that does not fit this Lambda:
  - CKV_AWS_117 # Lambda in a VPC: it would need a NAT gateway or three interface endpoints
  - CKV_AWS_116 # Lambda DLQ: errors already alarm to SNS and the upload can be re-sent
  - CKV_AWS_115 # Reserved concurrency: would eat into a small account's concurrency pool
  - CKV_AWS_272 # Lambda code signing
  # The state bucket needs no event notifications.
  - CKV2_AWS_62
