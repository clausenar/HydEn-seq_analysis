name: Build and push pipeline image

# Rebuilds the AWS Batch container image whenever pipeline code changes on
# main, and pushes it to ECR as :latest. Batch jobs always run whatever
# image currently has that tag - this workflow is what keeps it in sync
# with the code, decoupled from actual job runs (see docker/Dockerfile,
# which git-clones this repo at build time rather than copying a local
# checkout).
on:
  push:
    branches: [main]
    paths:
      - "Snakefile"
      - "*.py"
      - "bin/**"
      - "or200.txt"
      - "docker/**"
      - ".github/workflows/build-and-push-image.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hyden-seq-pipeline

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::069509443906:role/hyden-seq-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            GIT_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
